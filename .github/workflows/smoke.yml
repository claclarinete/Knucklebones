name: Verificação de produção

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Conferir endereços publicados
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Avisar se os endereços não estão configurados
        if: ${{ env.BACKEND_URL == '' || env.FRONTEND_URL == '' }}
        run: echo "::warning::Defina as variáveis BACKEND_URL e FRONTEND_URL do repositório (veja docs/deploy.md)."
      - name: Backend responde no /health
        if: ${{ env.BACKEND_URL != '' }}
        # As tentativas cobrem o tempo que o plano gratuito leva para acordar.
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 15 --retry-all-errors --max-time 60 "$BACKEND_URL/health" | grep -q '"status":"ok"' \
            || { echo "::error::Falha no backend: $BACKEND_URL/health"; exit 1; }
      - name: Frontend abre a página inicial e uma rota interna
        if: ${{ !cancelled() && env.FRONTEND_URL != '' }}
        run: |
          for caminho in / /regras; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 30 "$FRONTEND_URL$caminho" | grep -q 'Knucklebones Online' \
              || { echo "::error::Falha no frontend: $FRONTEND_URL$caminho"; exit 1; }
          done
