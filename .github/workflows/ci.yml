name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  testes:
    name: ${{ matrix.projeto }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        projeto: [backend, frontend]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.projeto }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.projeto }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run test:coverage
      - name: Resumir a cobertura
        if: ${{ !cancelled() && hashFiles(format('{0}/coverage/coverage-summary.json', matrix.projeto)) != '' }}
        env:
          TITULO: ${{ matrix.projeto }} (${{ matrix.os }})
        run: |
          node -e '
            const { total } = require("./coverage/coverage-summary.json");
            console.log(`### Cobertura: ${process.env.TITULO}\n`);
            console.log("| Métrica | % |\n|---|---|");
            for (const [nome, chave] of [["Linhas", "lines"], ["Funções", "functions"], ["Ramos", "branches"], ["Instruções", "statements"]])
              console.log(`| ${nome} | ${total[chave].pct} |`);
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cobertura-${{ matrix.projeto }}-${{ matrix.os }}
          path: ${{ matrix.projeto }}/coverage
          if-no-files-found: ignore
      - run: npm run build

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      # O Playwright sobe o backend e o frontend a partir das pastas deles.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ matrix.os }}
          path: e2e/playwright-report
          if-no-files-found: ignore

  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [testes, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o resultado dos outros jobs
        env:
          TESTES: ${{ needs.testes.result }}
          E2E: ${{ needs.e2e.result }}
        run: test "$TESTES" = success && test "$E2E" = success
