# Blueprint da Render: publica o backend e o frontend a partir da main.
services:
  - type: web
    name: knucklebones-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      # Endereço do frontend, sem barra no final (usado no CORS).
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: knucklebones-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      # Endereço do backend, sem barra no final. Entra no build.
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
    # Rotas como /partida/K7P2QX abrem direto no navegador.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
